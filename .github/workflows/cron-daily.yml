name: Daily — Sync UFC Events

on:
  schedule:
    - cron: '0 2 * * *'   # 2:00 AM UTC every day
  workflow_dispatch:        # allows manual trigger from GitHub UI → Actions tab

jobs:
  sync-events:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run daily sync
        run: npm run gh:cron-daily
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          DIRECT_URL:        ${{ secrets.DIRECT_URL }}
          USE_NEON_ADAPTER:  'true'
          NODE_ENV:          production
