name: Weekly — Process Results & Rebuild ELO

on:
  schedule:
    - cron: '0 4 * * 0'   # 4:00 AM UTC every Sunday
  workflow_dispatch:        # allows manual trigger from GitHub UI → Actions tab

jobs:
  process-results:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run weekly process
        run: npm run gh:cron-weekly
        env:
          DATABASE_URL:      ${{ secrets.DATABASE_URL }}
          DIRECT_URL:        ${{ secrets.DIRECT_URL }}
          USE_NEON_ADAPTER:  'true'
          NODE_ENV:          production
